<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Mes colis · DROP</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="theme-color" content="#08070b" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mes colis" />
<link rel="stylesheet" href="/portail.css" />
</head>
<body class="portail">

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3.5v10.5M7.5 9.5 12 14l4.5-4.5"/><path d="M4.5 14.5v3a2.5 2.5 0 0 0 2.5 2.5h10a2.5 2.5 0 0 0 2.5-2.5v-3"/></symbol>
  <symbol id="i-a_imprimer" viewBox="0 0 24 24"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-10z"/><path d="M14 3.5v5h5"/><path d="M9 13h6M9 16.5h4"/></symbol>
  <symbol id="i-imprime" viewBox="0 0 24 24"><path d="M7 8.5V3.5h10v5"/><rect x="3" y="8.5" width="18" height="8.5" rx="2"/><path d="M7 14h10v6.5H7z"/></symbol>
  <symbol id="i-en_drop" viewBox="0 0 24 24"><path d="M14 16.5V6H2.5v10.5H4"/><path d="M14 16.5H9.5"/><path d="M14 9.5h4.2l3.3 3.6v3.4H20"/><circle cx="6.75" cy="17" r="2.25"/><circle cx="17.25" cy="17" r="2.25"/></symbol>
  <symbol id="i-drope" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.25 12.25 2.5 2.5 5-5.25"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5v-2a2.5 2.5 0 0 0-2.5-2.5H6a2.5 2.5 0 0 0-2.5 2.5v7A2.5 2.5 0 0 0 6 16h2.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M13.5 4.5h6v6"/><path d="M19.5 4.5 11 13"/><path d="M17.5 14v4a2 2 0 0 1-2 2h-9.5a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2H10"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></symbol>
</svg>

<div class="fond" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="page" id="page">
  <header class="tete">
    <div class="marque">
      <span class="marque-logo"><svg class="icon"><use href="#i-logo"/></svg></span>
      <span class="marque-nom">DROP</span>
    </div>
    <div class="direct" id="direct" aria-live="off">
      <span class="direct-point"></span><span id="direct-texte">Connexion…</span>
    </div>
  </header>

  <section class="accueil" id="accueil" hidden>
    <p class="accueil-sur">Espace expéditeur</p>
    <h1 class="accueil-nom" id="nom">—</h1>
    <p class="accueil-sous" id="resume">—</p>
  </section>

  <section class="etapes" id="etapes" aria-label="Où en sont tes colis" hidden>
    <button class="etape" type="button" data-etape="a_imprimer" aria-pressed="false">
      <span class="etape-icone"><svg class="icon"><use href="#i-a_imprimer"/></svg></span>
      <span class="etape-nombre" data-compte="a_imprimer">0</span>
      <span class="etape-nom">Pas imprimé</span>
    </button>
    <button class="etape" type="button" data-etape="imprime" aria-pressed="false">
      <span class="etape-icone"><svg class="icon"><use href="#i-imprime"/></svg></span>
      <span class="etape-nombre" data-compte="imprime">0</span>
      <span class="etape-nom">Imprimé</span>
    </button>
    <button class="etape" type="button" data-etape="en_drop" aria-pressed="false">
      <span class="etape-icone"><svg class="icon"><use href="#i-en_drop"/></svg></span>
      <span class="etape-nombre" data-compte="en_drop">0</span>
      <span class="etape-nom">En cours de drop</span>
    </button>
    <button class="etape" type="button" data-etape="drope" aria-pressed="false">
      <span class="etape-icone"><svg class="icon"><use href="#i-drope"/></svg></span>
      <span class="etape-nombre" data-compte="drope">0</span>
      <span class="etape-nom">Drop</span>
    </button>
  </section>

  <div class="filtre" id="filtre" hidden>
    <span id="filtre-texte"></span>
    <button type="button" class="filtre-tout" id="filtre-tout">Tout voir</button>
  </div>

  <section class="liste" id="liste" aria-label="Tes colis"></section>

  <div class="squelette" id="squelette" aria-hidden="true">
    <div class="carte-vide"></div><div class="carte-vide"></div><div class="carte-vide"></div>
  </div>

  <button class="plus" id="plus" type="button" hidden>Voir les colis plus anciens</button>

  <section class="message" id="message" hidden>
    <span class="message-icone"><svg class="icon"><use href="#i-lock"/></svg></span>
    <h1 id="message-titre">Lien invalide</h1>
    <p id="message-texte">Ce lien n'est pas valide, ou n'est plus actif. Demande un nouveau lien à la personne qui gère tes colis.</p>
  </section>

  <p class="pied" id="pied" hidden>Cette page se met à jour toute seule. Elle est privée : ne partage pas son lien.</p>
</main>

<div class="annonce" id="annonce" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/portail.js"></script>
</body>
</html>
