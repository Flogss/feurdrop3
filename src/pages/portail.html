<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Mes colis · DROP</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="theme-color" content="#08070b" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mes colis" />
<!-- le systeme de design du dashboard, puis ce qui est propre au portail -->
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/portail.css" />
</head>
<body class="portail">

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3.5v10.5M7.5 9.5 12 14l4.5-4.5"/><path d="M4.5 14.5v3a2.5 2.5 0 0 0 2.5 2.5h10a2.5 2.5 0 0 0 2.5-2.5v-3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.75-4.75"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11.5" height="11.5" rx="2.5"/><path d="M15 9V5.5A2 2 0 0 0 13 3.5H5.5a2 2 0 0 0-2 2V13a2 2 0 0 0 2 2H9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6.5 9.5 17 4 11.5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3.5h6.5V10M20.5 3.5 11.5 12.5"/><path d="M18.5 14v4.5a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2H10"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8z"/><path d="m3.5 12 8.5 4.5 8.5-4.5"/><path d="m3.5 16 8.5 4.5 8.5-4.5"/></symbol>
  <!-- les quatre etapes -->
  <symbol id="i-a_imprimer" viewBox="0 0 24 24"><path d="M14 3H6.5a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16.5h4"/></symbol>
  <symbol id="i-imprime" viewBox="0 0 24 24"><path d="M7 8.5V3.5h10v5"/><rect x="3" y="8.5" width="18" height="8.5" rx="2"/><path d="M7 14h10v6.5H7z"/></symbol>
  <symbol id="i-en_drop" viewBox="0 0 24 24"><path d="M14 16.5V6H2.5v10.5H4"/><path d="M14 16.5H9.5"/><path d="M14 9.5h4.2l3.3 3.6v3.4H20"/><circle cx="6.75" cy="17" r="2.25"/><circle cx="17.25" cy="17" r="2.25"/></symbol>
  <symbol id="i-drope" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.25 12.25 2.5 2.5 5-5.25"/></symbol>
</svg>

<!-- le meme fond vivant que le dashboard -->
<div class="ambient" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
  <canvas class="particules" id="particules"></canvas>
  <span class="grain"></span>
</div>

<div class="p-app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
      <span class="brand-word">DROP<span class="brand-ext">.suivi</span></span>
    </div>
    <div class="topbar-end">
      <span class="live" id="live"><span class="live-dot"></span><span id="live-text">Connexion…</span></span>
    </div>
  </header>

  <div class="p-layout" id="contenu">
    <!-- a gauche sur ordinateur, en haut sur telephone -->
    <aside class="p-side">
      <section class="p-hello">
        <span class="eyebrow">Espace expéditeur</span>
        <h1 class="p-nom is-loading" id="nom">Chargement</h1>
        <p class="p-resume" id="resume"></p>
      </section>

      <div class="p-search" id="zone-recherche">
        <svg class="icon p-search-icone" aria-hidden="true"><use href="#i-search"/></svg>
        <label class="sr" for="recherche">Rechercher un numéro de suivi</label>
        <input class="field" id="recherche" type="search" placeholder="Rechercher un numéro de suivi…"
               inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" />
        <kbd class="p-search-raccourci" aria-hidden="true">/</kbd>
        <button class="btn btn-icon btn-sm btn-ghost p-search-effacer" id="effacer" type="button" aria-label="Effacer la recherche" hidden>
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>

      <section class="p-etapes" aria-label="Filtrer par statut">
        <button class="card metric p-etape" type="button" data-etape="a_imprimer" aria-pressed="false">
          <span class="p-etape-icone"><svg class="icon"><use href="#i-a_imprimer"/></svg></span>
          <span class="metric-value" data-compte="a_imprimer">0</span>
          <span class="p-etape-nom">Pas imprimé</span>
        </button>
        <button class="card metric p-etape" type="button" data-etape="imprime" aria-pressed="false">
          <span class="p-etape-icone"><svg class="icon"><use href="#i-imprime"/></svg></span>
          <span class="metric-value" data-compte="imprime">0</span>
          <span class="p-etape-nom">Imprimé</span>
        </button>
        <button class="card metric p-etape" type="button" data-etape="en_drop" aria-pressed="false">
          <span class="p-etape-icone"><svg class="icon"><use href="#i-en_drop"/></svg></span>
          <span class="metric-value" data-compte="en_drop">0</span>
          <span class="p-etape-nom">En cours de drop</span>
        </button>
        <button class="card metric p-etape" type="button" data-etape="drope" aria-pressed="false">
          <span class="p-etape-icone"><svg class="icon"><use href="#i-drope"/></svg></span>
          <span class="metric-value" data-compte="drope">0</span>
          <span class="p-etape-nom">Drop</span>
        </button>
      </section>

      <section class="card p-transporteurs" aria-label="Filtrer par transporteur">
        <header class="card-head"><h2>Transporteurs</h2></header>
        <div class="p-tr-liste" id="transporteurs"></div>
      </section>
    </aside>

    <main class="p-main">
      <div class="p-barre">
        <p class="p-barre-texte" id="barre-texte" aria-live="polite"></p>
        <div class="p-tri" role="group" aria-label="Trier">
          <button type="button" data-tri="recent" aria-pressed="true">Récents</button>
          <button type="button" data-tri="statut" aria-pressed="false">Statut</button>
        </div>
      </div>
      <div class="p-liste" id="liste">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <p class="p-pied" id="pied" hidden>Cette page se met à jour toute seule. Elle est privée : ne partage pas son lien.</p>
    </main>
  </div>

  <section class="p-message" id="message" hidden>
    <span class="empty-icon"><svg class="icon"><use href="#i-lock"/></svg></span>
    <h1 id="message-titre">Lien invalide</h1>
    <p id="message-texte">Ce lien n'est pas valide, ou n'est plus actif. Demande un nouveau lien à la personne qui gère tes colis.</p>
  </section>
</div>

<div class="toasts" id="toasts"></div>
<div class="sr" id="annonce" aria-live="polite"></div>

<script src="/portail.js"></script>
</body>
</html>
