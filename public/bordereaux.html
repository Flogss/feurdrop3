<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bordereaux · DROP.ctrl</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="theme-color" content="#08070b" />
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="styles.css" />
<!-- une page a part du dashboard : ses outils et sa visionneuse seulement
     (bordereaux.js, voir src/assemblage.js) ; meme session, memes styles -->
<script src="bordereaux.js" defer></script>
</head>
<body class="page-bdx">

  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.75-4.75"/></symbol>

  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11.5" height="11.5" rx="2.5"/><path d="M15 9V5.5A2 2 0 0 0 13 3.5H5.5a2 2 0 0 0-2 2V13a2 2 0 0 0 2 2H9"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V8H16"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6.5a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3.5M7 8.5l5-5 5 5"/><path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M15 20.5H5.5a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2V15z"/><path d="M15 20.5V15h5.5"/><path d="M8 8.5h8M8 12h5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9.5v4M12 17h.01"/><path d="M10.3 4 2.4 17.6A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-2.9L13.7 4a2 2 0 0 0-3.4 0z"/></symbol>

  <symbol id="i-merge" viewBox="0 0 24 24"><circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7.5v9"/><path d="M6 7.5c0 3 2.5 4.5 6 4.5h4"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8z"/><path d="m3.5 12 8.5 4.5 8.5-4.5"/><path d="m3.5 16 8.5 4.5 8.5-4.5"/></symbol>
  <symbol id="i-euro" viewBox="0 0 24 24"><path d="M18 6.5a7 7 0 1 0 0 11"/><path d="M4 10h9M4 14h9"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3-8.7 8.7z"/><circle cx="8" cy="8" r="1.5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3.5h6.5V10M20.5 3.5 11.5 12.5"/><path d="M18.5 14v4.5a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2H10"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4h12l-2 4 2 4H5"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4.5 3.5 6.5v13L9 17.5l6 2 5.5-2v-13L15 6.5z"/><path d="M9 4.5v13M15 6.5v13"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>

</svg>

<div class="bdx-fond" aria-hidden="true"></div>

<header class="bdx-haut">
  <a class="brand" href="/" title="Ouvrir le dashboard Drop">
    <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
    <span class="brand-word">DROP<span class="brand-ext">.ctrl</span></span>
  </a>
  <span class="bdx-separateur" aria-hidden="true"></span>
  <div class="bdx-titres">
    <h1>Bordereaux</h1>
    <p class="bdx-etat" id="bdx-etat"><span class="bdx-etat-point" aria-hidden="true"></span><span id="bdx-etat-texte">Étude des étiquettes et de leurs codes</span></p>
  </div>
  <div class="segmented bdx-onglets" role="tablist" aria-label="Bordereaux">
          <button type="button" role="tab" class="seg is-on" id="bdx-onglet-etude" data-bdx-onglet="etude" aria-selected="true" aria-controls="bdx-gauche-etude"><svg class="icon"><use href="#i-file"/></svg>Étude des bordereaux</button>
          <button type="button" role="tab" class="seg" id="bdx-onglet-recherche" data-bdx-onglet="recherche" aria-selected="false" aria-controls="bdx-gauche-recherche"><svg class="icon"><use href="#i-search"/></svg>Recherche / modifications</button>
        </div>
</header>

<main class="bdx-page">
      <div class="bdx-espace" id="bdx-espace" data-onglet="etude">
        <label class="bdx-grande-recherche" id="bdx-grande-recherche" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="bdx-q" type="search" placeholder="Rechercher un numéro de suivi…" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search" aria-label="Rechercher un numéro de suivi" aria-controls="bdx-resultats" />
          <kbd class="bdx-touche" aria-hidden="true">/</kbd>
        </label>

        <div class="bdx-colonnes">
          <!-- a gauche : les etiquettes (Etude) ou les resultats (Recherche) -->
          <aside class="card bdx-gauche" aria-label="Étiquettes">
            <div class="bdx-gauche-etude" id="bdx-gauche-etude" role="tabpanel" aria-labelledby="bdx-onglet-etude">
              <label class="bdx-filtre-champ">
                <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
                <input id="bdx-filtre" type="search" placeholder="Expéditeur ou fichier" autocomplete="off" spellcheck="false" aria-label="Filtrer les étiquettes" />
              </label>
              <div class="bdx-puces" id="bdx-filtres" role="radiogroup" aria-label="Étape">
                <button type="button" role="radio" class="bdx-puce is-on" data-filtre="tous" aria-checked="true">Toutes</button>
                <button type="button" role="radio" class="bdx-puce" data-filtre="a_imprimer" aria-checked="false">À imprimer</button>
                <button type="button" role="radio" class="bdx-puce" data-filtre="imprimes" aria-checked="false">Imprimées</button>
                <button type="button" role="radio" class="bdx-puce" data-filtre="deposes" aria-checked="false">Déposées</button>
              </div>
              <div class="bdx-tris" aria-label="Trier et filtrer">
                <label class="bdx-choix">
                  <span>Transporteur</span>
                  <select id="bdx-transporteur"><option value="">Tous</option></select>
                </label>
                <label class="bdx-choix">
                  <span>À partir du</span>
                  <input id="bdx-depuis" type="date" />
                </label>
                <label class="bdx-choix">
                  <span>Tri</span>
                  <select id="bdx-tri">
                    <option value="recent">Plus récentes</option>
                    <option value="ancien">Plus anciennes</option>
                    <option value="transporteur">Par transporteur</option>
                  </select>
                </label>
                <label class="bdx-choix">
                  <span>Catégorie</span>
                  <select id="bdx-categorie"><option value="">Toutes</option><option value="aucune">Sans catégorie</option></select>
                </label>
                <div class="bdx-tris-pied">
                  <span class="bdx-total" id="bdx-total" aria-live="polite"></span>
                  <button class="bdx-lien" id="bdx-effacer-filtres" type="button" hidden>Effacer les filtres</button>
                  <button class="bdx-lien" id="bdx-gerer-categories" type="button">Gérer les catégories</button>
                </div>
              </div>
              <ul class="bdx-liste" id="bdx-liste" aria-label="Étiquettes"></ul>
              <button class="btn btn-secondary btn-sm bdx-plus" id="bdx-plus" type="button" hidden>Plus d'étiquettes</button>
            </div>
            <div class="bdx-gauche-recherche" id="bdx-gauche-recherche" role="tabpanel" aria-labelledby="bdx-onglet-recherche" hidden>
              <p class="bdx-recherche-info" id="bdx-recherche-info"></p>
              <ul class="bdx-resultats" id="bdx-resultats" role="listbox" aria-label="Étiquettes trouvées"></ul>
            </div>
          </aside>

          <!-- au centre : la visionneuse -->
          <article class="bdx-visionneuse" id="bdx-visionneuse" aria-label="Visionneuse">
            <div class="bdx-scene" id="bdx-scene" tabindex="0" aria-label="Étiquette (glisser pour déplacer, Ctrl + molette pour zoomer)">
              <div class="bdx-feuille" id="bdx-feuille" hidden>
                <canvas class="bdx-canvas" id="bdx-canvas"></canvas>
                <img class="bdx-image" id="bdx-image" alt="" hidden />
                <div class="bdx-scan" aria-hidden="true"></div>
                <div class="bdx-zones" id="bdx-zones"></div>
              </div>
            </div>
            <div class="bdx-barre" id="bdx-barre" role="toolbar" aria-label="Affichage" hidden>
              <div class="bdx-groupe bdx-pages" id="bdx-pages">
                <button class="bdx-outil" id="bdx-page-prec" type="button" aria-label="Page précédente"><svg class="icon"><use href="#i-arrow-left"/></svg></button>
                <span class="bdx-page-texte" id="bdx-page-texte" aria-live="polite">1 / 1</span>
                <button class="bdx-outil" id="bdx-page-suiv" type="button" aria-label="Page suivante"><svg class="icon"><use href="#i-arrow-right"/></svg></button>
              </div>
              <div class="bdx-groupe">
                <button class="bdx-outil" id="bdx-zoom-moins" type="button" aria-label="Dézoomer"><svg class="icon"><use href="#i-minus"/></svg></button>
                <button class="bdx-zoom-valeur" id="bdx-zoom-valeur" type="button" aria-label="Zoom (cliquer pour 100 %)">100 %</button>
                <button class="bdx-outil" id="bdx-zoom-plus" type="button" aria-label="Zoomer"><svg class="icon"><use href="#i-plus"/></svg></button>
              </div>
              <div class="bdx-groupe">
                <button class="bdx-outil bdx-outil-texte" id="bdx-ajuste-largeur" type="button" aria-pressed="true" title="Ajuster à la largeur (0)">Largeur</button>
                <button class="bdx-outil bdx-outil-texte" id="bdx-ajuste-page" type="button" aria-pressed="false" title="Page entière (1)">Page</button>
              </div>
              <div class="bdx-groupe">
                <button class="bdx-outil bdx-outil-texte" id="bdx-zones-toutes" type="button" aria-pressed="false" title="Montrer toutes les zones (Z)"><svg class="icon"><use href="#i-barcode"/></svg>Zones</button>
              </div>
            </div>
            <div class="bdx-vide" id="bdx-vide">
              <span class="bdx-vide-icone"><svg class="icon"><use href="#i-barcode"/></svg></span>
              <b>Choisis une étiquette</b>
            </div>
            <div class="bdx-message" id="bdx-message" hidden></div>
            <div class="bdx-bulle" id="bdx-bulle" role="tooltip" hidden></div>
          </article>

          <!-- a droite : l'etiquette, ses codes, ses actions -->
          <aside class="card bdx-panneau" id="bdx-panneau" aria-label="Détails de l'étiquette" hidden></aside>
        </div>
      </div>
</main>

<!-- les categories : creer, renommer, recolorer, supprimer (les etiquettes restent) -->
<div class="bdx-fenetre" id="bdx-fenetre-categories" hidden>
  <div class="bdx-fenetre-fond" data-bdx-ferme></div>
  <section class="bdx-fenetre-carte" role="dialog" aria-modal="true" aria-labelledby="bdx-categories-titre">
    <header class="bdx-fenetre-tete">
      <h2 id="bdx-categories-titre">Catégories</h2>
      <button class="bdx-outil" type="button" data-bdx-ferme aria-label="Fermer"><svg class="icon"><use href="#i-x"/></svg></button>
    </header>
    <ul class="bdx-categories" id="bdx-categories-liste"></ul>
    <form class="bdx-categorie-nouvelle" id="bdx-categorie-nouvelle">
      <input id="bdx-categorie-nom" type="text" maxlength="40" placeholder="Nouvelle catégorie (ex. Retours)" autocomplete="off" />
      <button class="btn btn-primary btn-sm" type="submit"><svg class="icon"><use href="#i-plus"/></svg><span>Créer</span></button>
    </form>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
