<header class="ed-haut atelier-haut">
  <a class="brand" href="/bordereaux" title="Revenir aux bordereaux">
    <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
  </a>
  <div class="ed-titres">
    <h1>Comparer</h1>
    <p class="ed-sous"><span id="cmp-resume">Choisis deux étiquettes</span></p>
  </div>
  <nav class="espaces" aria-label="Espaces des bordereaux">
    <a class="espace" data-espace="etude" id="cmp-espace-etude" href="/bordereaux"><svg class="icon"><use href="#i-file"/></svg><span>Étude</span></a>
    <a class="espace" data-espace="modifier" id="cmp-espace-modifier" href="/bordereaux/editeur" target="_blank" rel="noopener"><svg class="icon"><use href="#i-edit"/></svg><span>Modifier</span></a>
    <a class="espace is-on" data-espace="comparer" href="#" aria-current="page"><svg class="icon"><use href="#i-comparer"/></svg><span>Comparer</span></a>
  </nav>
  <div class="atelier-droite">
    <div class="segmented cmp-modes" role="radiogroup" aria-label="Affichage">
      <button class="seg is-on" type="button" data-mode="cote" role="radio" aria-checked="true" title="Côte à côte (1)"><svg class="icon"><use href="#i-comparer"/></svg>Côte à côte</button>
      <button class="seg" type="button" data-mode="superpose" role="radio" aria-checked="false" title="Superposition (2)"><svg class="icon"><use href="#i-superpose"/></svg>Superposition</button>
      <button class="seg" type="button" data-mode="rideau" role="radio" aria-checked="false" title="Rideau : glisser pour comparer (3)"><svg class="icon"><use href="#i-rideau"/></svg>Rideau</button>
    </div>
    <button class="bouton-barre bouton-icone" id="cmp-bascule-panneau" type="button" aria-pressed="true" title="Liste des différences"><svg class="icon"><use href="#i-panneau-d"/></svg></button>
  </div>
</header>

<section class="cmp-pile" aria-label="Étiquettes comparées">
  <ol class="cmp-etiquettes" id="cmp-etiquettes"></ol>
  <div class="cmp-ajout">
    <label class="bdx-filtre-champ cmp-cherche">
      <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
      <input id="cmp-q" type="search" placeholder="Ajouter une étiquette : expéditeur, fichier ou numéro…" autocomplete="off" spellcheck="false" />
    </label>
    <ul class="cmp-propositions" id="cmp-propositions" hidden></ul>
  </div>
  <p class="cmp-astuce"><kbd>←</kbd><kbd>→</kbd> changer la comparée · <kbd>Espace</kbd> A ⇄ B</p>
</section>

    <article class="cmp-vue" data-cote="b">

      </div>
      <div class="cmp-pilule-groupe cmp-superpose-seul" id="cmp-opacite-bloc" hidden>
        <label class="cmp-opacite"><b class="cmp-lettre is-a">A</b><input id="cmp-opacite" type="range" min="0" max="100" value="50" aria-label="Transparence de B" /><b class="cmp-lettre is-b">B</b></label>
        <button class="ed-bouton cmp-bascule" id="cmp-difference" type="button" aria-pressed="false" title="Différence : ce qui est identique devient noir (D)"><span>Différence</span></button>
        <button class="ed-bouton cmp-bascule" id="cmp-clignote" type="button" aria-pressed="false" title="Basculer A ⇄ B en continu (Espace)"><span>A ⇄ B</span></button>
      </div>
    </div>
  </section>
  <aside class="ed-panneau cmp-panneau">
    <div class="cmp-legende" id="cmp-legende" aria-label="Légende : cliquer pour masquer ou montrer">
      <button type="button" class="cmp-cle is-modifie" data-statut="modifie" aria-pressed="true">Modifiés</button><button type="button" class="cmp-cle is-deplace" data-statut="deplace" aria-pressed="true">Déplacés</button><button type="button" class="cmp-cle is-ajoute" data-statut="ajoute" aria-pressed="true">Ajoutés</button><button type="button" class="cmp-cle is-supprime" data-statut="supprime" aria-pressed="true">Supprimés</button><button type="button" class="cmp-cle is-identique" data-statut="identique" aria-pressed="true">Identiques</button>
    </div>
    <div class="ed-panneau-corps" id="cmp-differences"><p class="ed-aide">Ajoute deux étiquettes.</p></div>
  </aside>
</main>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
