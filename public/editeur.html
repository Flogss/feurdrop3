<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Éditeur de bordereau · DROP.ctrl</title>

</head>

<div class="bdx-fond" aria-hidden="true"></div>

<header class="ed-haut">
  <a class="brand" href="/bordereaux" title="Revenir aux bordereaux">
    <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
  </a>
  <div class="ed-titres">
    <h1 id="ed-titre">Éditeur de bordereau</h1>
    <p class="ed-sous"><span class="ed-badge-travail">Version de travail</span><span id="ed-fichier">—</span></p>
  </div>
  <div class="ed-sauvegarde" id="ed-sauvegarde" aria-live="polite"><span class="ed-sauvegarde-point"></span><span id="ed-sauvegarde-texte">Pas encore modifié</span></div>
  <div class="ed-groupe-haut">
    <button class="ed-bouton" id="ed-annuler" type="button" title="Annuler (⌘Z / Ctrl+Z)" aria-label="Annuler"><svg class="icon"><use href="#i-annuler"/></svg></button>
    <button class="ed-bouton" id="ed-retablir" type="button" title="Rétablir (⌘⇧Z / Ctrl+Y)" aria-label="Rétablir"><svg class="icon"><use href="#i-retablir"/></svg></button>
  </div>
  <div class="ed-groupe-haut">
    <button class="ed-bouton" id="ed-zoom-moins" type="button" aria-label="Dézoomer"><svg class="icon"><use href="#i-minus"/></svg></button>
    <button class="ed-zoom" id="ed-zoom" type="button" title="Ajuster à la fenêtre">100 %</button>
    <button class="ed-bouton" id="ed-zoom-plus" type="button" aria-label="Zoomer"><svg class="icon"><use href="#i-plus"/></svg></button>
  </div>
  <div class="ed-groupe-haut ed-pages" id="ed-pages" hidden>
    <button class="ed-bouton" id="ed-page-prec" type="button" aria-label="Page précédente"><svg class="icon"><use href="#i-arrow-left"/></svg></button>
    <span id="ed-page-texte">1 / 1</span>
    <button class="ed-bouton" id="ed-page-suiv" type="button" aria-label="Page suivante"><svg class="icon"><use href="#i-arrow-right"/></svg></button>
  </div>
  <button class="ed-bouton ed-bouton-seul mac-seul" id="ed-bascule-panneau" data-action="panneau" type="button" title="Afficher / masquer le panneau (⌘\)" aria-label="Panneau" aria-pressed="true"><svg class="icon"><use href="#i-panneau"/></svg></button>
  <a class="btn btn-secondary btn-sm" id="ed-comparer" href="#" target="_blank" rel="noopener"><svg class="icon"><use href="#i-comparer"/></svg><span>Comparer</span></a>
  <button class="btn btn-primary btn-sm" id="ed-exporter" type="button"><svg class="icon"><use href="#i-telecharger"/></svg><span>Exporter le PDF</span></button>
</header>

<div class="ed-bandeau" id="ed-bandeau" hidden></div>

<main class="ed-espace">
  <nav class="ed-outils" id="ed-outils" aria-label="Outils">
    <button class="ed-outil is-on" data-outil="selection" type="button" title="Sélection (V)" aria-label="Sélection"><svg class="icon"><use href="#i-curseur"/></svg></button>
    <button class="ed-outil" data-outil="main" type="button" title="Déplacer la vue (H, ou Espace + glisser)" aria-label="Déplacer la vue"><svg class="icon"><use href="#i-main"/></svg></button>
    <span class="ed-outils-sep"></span>
    <button class="ed-outil" data-outil="texte" type="button" title="Ajouter un texte (T)" aria-label="Ajouter un texte"><svg class="icon"><use href="#i-texte"/></svg></button>
    <button class="ed-outil" data-outil="barres" type="button" title="Ajouter un code-barres (B)" aria-label="Ajouter un code-barres"><svg class="icon"><use href="#i-barcode"/></svg></button>
    <button class="ed-outil" data-outil="qr" type="button" title="Ajouter un QR code (Q)" aria-label="Ajouter un QR code"><svg class="icon"><use href="#i-qr"/></svg></button>
    <button class="ed-outil" data-outil="rect" type="button" title="Ajouter un rectangle (R) — pour masquer une zone" aria-label="Ajouter un rectangle"><svg class="icon"><use href="#i-carre"/></svg></button>
    <button class="ed-outil mac-seul" data-action="ajouter-image" type="button" title="Ajouter une image (I) — ou glisse-la depuis le Finder" aria-label="Ajouter une image"><svg class="icon"><use href="#i-image"/></svg></button>
    <span class="ed-outils-sep"></span>
    <button class="ed-outil" data-action="dupliquer" type="button" title="Dupliquer (⌘D / Ctrl+D)" aria-label="Dupliquer"><svg class="icon"><use href="#i-dupliquer"/></svg></button>
    <button class="ed-outil" data-action="supprimer" type="button" title="Supprimer (Suppr)" aria-label="Supprimer"><svg class="icon"><use href="#i-trash"/></svg></button>
    <button class="ed-outil" data-action="devant" type="button" title="Mettre devant (])" aria-label="Mettre devant"><svg class="icon"><use href="#i-devant"/></svg></button>
    <button class="ed-outil" data-action="derriere" type="button" title="Mettre derrière ([)" aria-label="Mettre derrière"><svg class="icon"><use href="#i-derriere"/></svg></button>
    <button class="ed-outil" data-action="verrou" type="button" title="Verrouiller / déverrouiller (⌘L)" aria-label="Verrouiller"><svg class="icon"><use href="#i-cadenas"/></svg></button>
    <span class="ed-outils-sep"></span>
    <button class="ed-outil" data-bascule="grille" type="button" title="Grille (5 mm) — G" aria-label="Grille" aria-pressed="false"><svg class="icon"><use href="#i-grille"/></svg></button>
    <button class="ed-outil" data-bascule="magnetisme" type="button" title="Magnétisme et guides d'alignement — M" aria-label="Magnétisme" aria-pressed="true"><svg class="icon"><use href="#i-aimant"/></svg></button>
  </nav>

  <section class="ed-zone" id="ed-zone" aria-label="Zone de travail">
    <div class="ed-scene" id="ed-scene" tabindex="0">
      <div class="ed-feuille" id="ed-feuille" hidden>
        <canvas class="ed-canvas" id="ed-canvas"></canvas>
        <img class="ed-image" id="ed-image" alt="" hidden />
        <div class="ed-grille" id="ed-grille" hidden></div>
        <div class="ed-calque-original" id="ed-originaux"></div>
        <div class="ed-calque" id="ed-masques"></div>
        <div class="ed-calque" id="ed-elements"></div>
        <div class="ed-calque ed-guides" id="ed-guides"></div>
        <div class="ed-selection" id="ed-selection" hidden></div>
        <div class="ed-lasso" id="ed-lasso" hidden></div>
      </div>
      <div class="ed-chargement" id="ed-chargement"><span class="bdx-roue"></span><span>Ouverture de l'étiquette…</span></div>
    </div>
  </section>

  <aside class="ed-panneau" aria-label="Panneau">
    <div class="segmented ed-onglets" role="tablist">
      <button class="seg is-on" data-onglet="proprietes" type="button" role="tab" aria-selected="true">Propriétés</button>
      <button class="seg" data-onglet="calques" type="button" role="tab" aria-selected="false"><svg class="icon"><use href="#i-calques"/></svg>Calques</button>
      <button class="seg" data-onglet="historique" type="button" role="tab" aria-selected="false"><svg class="icon"><use href="#i-clock"/></svg>Historique</button>
    </div>
    <div class="ed-panneau-corps" id="ed-proprietes"></div>
    <div class="ed-panneau-corps" id="ed-calques" hidden></div>
    <div class="ed-panneau-corps" id="ed-historique" hidden></div>
  </aside>
</main>

<div class="ed-menu" id="ed-menu" role="menu" hidden></div>
<div class="ed-depot-etiquette" id="ed-depot-etiquette" hidden></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
